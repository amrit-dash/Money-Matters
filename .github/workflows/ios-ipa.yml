# Build installable iOS IPA on GitHub-hosted macOS — no local Xcode on your machine.
# Signing secrets required for device install (see docs/SETUP-GITHUB-ACTIONS.md).

name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-ipa.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install GoogleService-Info.plist from secret
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Wrote plist from GitHub secret."
          elif [ -f ios/Runner/GoogleService-Info.plist ]; then
            echo "Using committed plist (private repo only)."
          else
            echo "::error::Add secret GOOGLE_SERVICE_INFO_PLIST_BASE64 or commit plist in a private repo."
            exit 1
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Import code signing (optional)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build unsigned iOS (smoke)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 == '' }}
        run: flutter build ios --release --no-codesign

      - name: Build signed IPA
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMatters-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload unsigned app bundle info
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 == '' }}
        run: |
          echo "::notice::Signing secrets not set — built unsigned only. Add secrets per docs/SETUP-GITHUB-ACTIONS.md for installable IPA."
