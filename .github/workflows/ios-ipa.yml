# Build installable iOS IPA on GitHub-hosted macOS — no local Xcode on your machine.
# Signing secrets required for device install (see docs/SETUP-SIGNING-FREE-ACCOUNT.md).

name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'scripts/prepare_export_options_ci.sh'
      - 'scripts/configure_ci_signing.sh'
      - 'scripts/verify_ci_signing.sh'
      - 'scripts/build_ipa_ci.sh'
      - 'scripts/generate_firebase_options_from_plist.sh'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Flutter version so the ~2GB SDK cache key stays stable (channel: stable alone
      # changes when Flutter releases a new stable, causing cache misses every time).
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Flutter cache status
        run: |
          echo "Flutter SDK cache hit: ${{ steps.flutter.outputs.CACHE-HIT }}"
          echo "Pub cache hit: ${{ steps.flutter.outputs.PUB-CACHE-HIT }}"

      - name: Install GoogleService-Info.plist from secret
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Wrote plist from GitHub secret."
          elif [ -f ios/Runner/GoogleService-Info.plist ]; then
            echo "Using committed plist (private repo only)."
          else
            echo "::error::Add secret GOOGLE_SERVICE_INFO_PLIST_BASE64 or commit plist in a private repo."
            exit 1
          fi

      - name: Generate firebase_options.dart for CI
        run: |
          chmod +x scripts/generate_firebase_options_from_plist.sh
          ./scripts/generate_firebase_options_from_plist.sh

      - name: Detect signing secrets
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Import code signing
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          set +e
          IMPORT_ERR=$(security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" 2>&1)
          IMPORT_RC=$?
          set -e
          if [ "$IMPORT_RC" -ne 0 ]; then
            echo "$IMPORT_ERR"
            echo "::error::Could not import BUILD_CERTIFICATE_BASE64 (.p12). This almost always means P12_PASSWORD does not match the password used when exporting the .p12, or the certificate secret is stale/wrong. Fix: re-export .p12 from Keychain Access (Apple Development + private key), then update BOTH secrets — gh secret set P12_PASSWORD --repo amrit-dash/Money-Matters and re-upload BUILD_CERTIFICATE_BASE64. If you use ./scripts/upload_signing_to_github.sh, it only sets P12_PASSWORD when missing; run gh secret set P12_PASSWORD manually after a new export. See docs/SETUP-SIGNING-FREE-ACCOUNT.md."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          PP_UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          for PROFILE_DIR in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$PROFILE_DIR"
            cp "$PP_PATH" "$PROFILE_DIR/${PP_UUID}.mobileprovision"
          done
          echo "Installed provisioning profile ${PP_UUID}"
          security find-identity -v -p codesigning | head -5 || true

          chmod +x scripts/prepare_export_options_ci.sh scripts/configure_ci_signing.sh scripts/verify_ci_signing.sh
          ./scripts/prepare_export_options_ci.sh "$PP_PATH"
          ./scripts/configure_ci_signing.sh "$PP_PATH"
          ./scripts/verify_ci_signing.sh "$PP_PATH"

          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" ios/ExportOptions.ci.plist
          fi

      - name: Build unsigned iOS (smoke)
        if: steps.signing.outputs.enabled != 'true'
        run: flutter build ios --release --no-codesign

      - name: Build signed IPA
        if: steps.signing.outputs.enabled == 'true'
        run: |
          chmod +x scripts/build_ipa_ci.sh
          ./scripts/build_ipa_ci.sh

      - name: Upload IPA artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMatters-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Unsigned build notice
        if: steps.signing.outputs.enabled != 'true'
        run: |
          echo "::notice::Signing secrets not set — built unsigned only. Follow docs/SETUP-SIGNING-FREE-ACCOUNT.md for an installable IPA."
