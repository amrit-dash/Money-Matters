<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="1024" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0EEFF"/>
      <stop offset="1" stop-color="#FFF0E8"/>
    </linearGradient>
    <linearGradient id="b-pill" x1="120" y1="180" x2="480" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E4FF"/>
    </linearGradient>
    <linearGradient id="b-tile1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9EC8"/>
      <stop offset="1" stop-color="#FF7EB3"/>
    </linearGradient>
    <linearGradient id="b-tile2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD4FF"/>
      <stop offset="1" stop-color="#5BC4FF"/>
    </linearGradient>
    <linearGradient id="b-tile3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFBE78"/>
      <stop offset="1" stop-color="#FFAA5C"/>
    </linearGradient>
    <linearGradient id="b-tile4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4A0FF"/>
      <stop offset="1" stop-color="#B088FF"/>
    </linearGradient>
    <linearGradient id="b-tile5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset="1" stop-color="#FF7060"/>
    </linearGradient>
    <filter id="b-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#B088FF" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#b-bg)"/>

  <!-- Subtle background arcs -->
  <path d="M-40 700 Q400 500 600 900" stroke="#B088FF" stroke-width="24" stroke-linecap="round" opacity="0.12"/>
  <path d="M200 100 Q700 300 900 600" stroke="#FFAA5C" stroke-width="20" stroke-linecap="round" opacity="0.1"/>

  <!-- Cascading category tiles -->
  <g filter="url(#b-shadow)">
    <!-- Row 1 -->
    <rect x="520" y="680" width="200" height="200" rx="48" fill="url(#b-tile5)" transform="rotate(-8 620 780)"/>
    <rect x="720" y="720" width="180" height="180" rx="44" fill="url(#b-tile4)" transform="rotate(6 810 810)"/>

    <!-- Row 2 -->
    <rect x="380" y="500" width="220" height="220" rx="52" fill="url(#b-tile3)" transform="rotate(-5 490 610)"/>
    <rect x="600" y="480" width="200" height="200" rx="48" fill="url(#b-tile2)" transform="rotate(10 700 580)"/>

    <!-- Row 3 -->
    <rect x="560" y="300" width="240" height="240" rx="56" fill="url(#b-tile1)" transform="rotate(-6 680 420)"/>
    <rect x="780" y="340" width="160" height="160" rx="40" fill="url(#b-tile4)" transform="rotate(12 860 420)"/>
  </g>

  <!-- Tile detail dots (category markers) -->
  <g opacity="0.85">
    <circle cx="470" cy="560" r="18" fill="#FFFFFF"/>
    <circle cx="660" cy="540" r="18" fill="#FFFFFF"/>
    <circle cx="640" cy="760" r="16" fill="#FFFFFF"/>
    <circle cx="660" cy="380" r="20" fill="#FFFFFF"/>
  </g>

  <!-- Source SMS pill -->
  <g filter="url(#b-shadow)">
    <rect x="100" y="200" width="420" height="160" rx="80" fill="url(#b-pill)" stroke="#D8D0FF" stroke-width="6"/>
    <rect x="160" y="250" width="220" height="22" rx="11" fill="#B088FF" opacity="0.35"/>
    <rect x="160" y="290" width="160" height="22" rx="11" fill="#FFAA5C" opacity="0.35"/>
    <rect x="160" y="330" width="190" height="22" rx="11" fill="#5BC4FF" opacity="0.35"/>
  </g>

  <!-- Flow trails from pill to tiles -->
  <path d="M480 320 C560 360 620 400 660 440" stroke="#FF7EB3" stroke-width="14" stroke-linecap="round" opacity="0.4"/>
  <path d="M460 340 C540 420 580 500 620 580" stroke="#5BC4FF" stroke-width="12" stroke-linecap="round" opacity="0.35"/>
  <path d="M440 360 C500 480 540 600 580 720" stroke="#FFAA5C" stroke-width="10" stroke-linecap="round" opacity="0.3"/>

  <!-- Small incoming message fragments -->
  <rect x="80" y="420" width="100" height="56" rx="28" fill="#FF7EB3" opacity="0.5" transform="rotate(-15 130 448)"/>
  <rect x="60" y="520" width="80" height="48" rx="24" fill="#5BC4FF" opacity="0.45" transform="rotate(-20 100 544)"/>
</svg>
