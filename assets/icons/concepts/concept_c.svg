<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <radialGradient id="c-bg" cx="512" cy="512" r="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8F2"/>
      <stop offset="1" stop-color="#F5EEFF"/>
    </radialGradient>
    <linearGradient id="c-petal1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A8B"/>
      <stop offset="1" stop-color="#FF6B6B"/>
    </linearGradient>
    <linearGradient id="c-petal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD56A"/>
      <stop offset="1" stop-color="#FFB830"/>
    </linearGradient>
    <linearGradient id="c-petal3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ED4FF"/>
      <stop offset="1" stop-color="#5BC4FF"/>
    </linearGradient>
    <linearGradient id="c-petal4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4A0FF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <linearGradient id="c-petal5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9EC8"/>
      <stop offset="1" stop-color="#FF7EB3"/>
    </linearGradient>
    <linearGradient id="c-core" x1="412" y1="412" x2="612" y2="612" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0EAFF"/>
    </linearGradient>
    <filter id="c-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9B7BFF" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#c-bg)"/>

  <!-- Orbital ring -->
  <circle cx="512" cy="512" r="340" stroke="#E0D4FF" stroke-width="8" stroke-dasharray="24 20" opacity="0.6"/>
  <circle cx="512" cy="512" r="400" stroke="#FFD56A" stroke-width="6" stroke-dasharray="16 28" opacity="0.25"/>

  <!-- Orbiting message bubbles -->
  <g filter="url(#c-shadow)">
    <!-- Top -->
    <path d="M512 80 C560 80 600 120 600 168 C600 216 560 256 512 256 C464 256 424 216 424 168 C424 120 464 80 512 80 Z" fill="#5BC4FF" opacity="0.75"/>
    <rect x="460" y="148" width="80" height="10" rx="5" fill="#FFFFFF" opacity="0.7"/>
    <rect x="460" y="168" width="56" height="10" rx="5" fill="#FFFFFF" opacity="0.5"/>

    <!-- Top-right -->
    <path d="M820 280 C860 280 892 312 892 352 C892 392 860 424 820 424 C780 424 748 392 748 352 C748 312 780 280 820 280 Z" fill="#FF7EB3" opacity="0.7"/>
    <rect x="776" y="340" width="56" height="10" rx="5" fill="#FFFFFF" opacity="0.65"/>

    <!-- Right -->
    <path d="M880 512 C920 512 952 544 952 584 C952 624 920 656 880 656 C840 656 808 624 808 584 C808 544 840 512 880 512 Z" fill="#FFB830" opacity="0.72"/>

    <!-- Bottom-left -->
    <path d="M180 680 C220 680 252 712 252 752 C252 792 220 824 180 824 C140 824 108 792 108 752 C108 712 140 680 180 680 Z" fill="#9B7BFF" opacity="0.68"/>
    <rect x="136" y="740" width="64" height="10" rx="5" fill="#FFFFFF" opacity="0.6"/>

    <!-- Left -->
    <path d="M120 400 C160 400 192 432 192 472 C192 512 160 544 120 544 C80 544 48 512 48 472 C48 432 80 400 120 400 Z" fill="#FF6B6B" opacity="0.65"/>
  </g>

  <!-- Inward flow curves -->
  <path d="M512 256 C512 340 512 380 512 420" stroke="#5BC4FF" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
  <path d="M780 352 C700 400 620 440 560 470" stroke="#FF7EB3" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <path d="M840 584 C740 560 640 540 560 520" stroke="#FFB830" stroke-width="8" stroke-linecap="round" opacity="0.28"/>
  <path d="M192 752 C320 660 420 580 480 530" stroke="#9B7BFF" stroke-width="8" stroke-linecap="round" opacity="0.28"/>
  <path d="M156 472 C280 480 400 490 470 500" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round" opacity="0.25"/>

  <!-- Central organized pinwheel -->
  <g filter="url(#c-shadow)">
    <ellipse cx="512" cy="380" rx="100" ry="140" fill="url(#c-petal1)" transform="rotate(0 512 512)"/>
    <ellipse cx="512" cy="380" rx="100" ry="140" fill="url(#c-petal2)" transform="rotate(72 512 512)"/>
    <ellipse cx="512" cy="380" rx="100" ry="140" fill="url(#c-petal3)" transform="rotate(144 512 512)"/>
    <ellipse cx="512" cy="380" rx="100" ry="140" fill="url(#c-petal4)" transform="rotate(216 512 512)"/>
    <ellipse cx="512" cy="380" rx="100" ry="140" fill="url(#c-petal5)" transform="rotate(288 512 512)"/>
    <circle cx="512" cy="512" r="72" fill="url(#c-core)"/>
    <!-- Mini chart in core -->
    <rect x="472" y="500" width="16" height="40" rx="8" fill="#FF6B6B" opacity="0.8"/>
    <rect x="496" y="480" width="16" height="60" rx="8" fill="#FFB830" opacity="0.8"/>
    <rect x="520" y="460" width="16" height="80" rx="8" fill="#9B7BFF" opacity="0.8"/>
  </g>
</svg>
