<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF5EB"/>
      <stop offset="1" stop-color="#FFE8F4"/>
    </linearGradient>
    <linearGradient id="a-bubble" x1="180" y1="620" x2="520" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B8CFF"/>
      <stop offset="1" stop-color="#5B6BEE"/>
    </linearGradient>
    <linearGradient id="a-bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset="1" stop-color="#FF6B6B"/>
    </linearGradient>
    <linearGradient id="a-bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD060"/>
      <stop offset="1" stop-color="#FFB830"/>
    </linearGradient>
    <linearGradient id="a-bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B89BFF"/>
      <stop offset="1" stop-color="#8B6BFF"/>
    </linearGradient>
    <filter id="a-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#5B6BEE" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#a-bg)"/>

  <!-- Decorative dots -->
  <circle cx="820" cy="180" r="28" fill="#FFB830" opacity="0.55"/>
  <circle cx="880" cy="280" r="16" fill="#FF6B6B" opacity="0.45"/>
  <circle cx="760" cy="260" r="12" fill="#8B6BFF" opacity="0.4"/>
  <circle cx="160" cy="200" r="20" fill="#FF8A7A" opacity="0.35"/>

  <!-- Chart bars blooming from bubble -->
  <g filter="url(#a-shadow)">
    <rect x="420" y="340" width="120" height="280" rx="60" fill="url(#a-bar3)"/>
    <rect x="560" y="260" width="120" height="360" rx="60" fill="url(#a-bar2)"/>
    <rect x="700" y="180" width="120" height="440" rx="60" fill="url(#a-bar1)"/>
  </g>

  <!-- Message bubble -->
  <g filter="url(#a-shadow)">
    <path d="M180 620 C180 520 260 440 380 440 H560 C680 440 760 520 760 620 C760 720 680 800 560 800 H340 L220 880 L240 800 C200 780 180 720 180 620 Z" fill="url(#a-bubble)"/>
    <!-- SMS lines inside bubble -->
    <rect x="280" y="540" width="280" height="28" rx="14" fill="#FFFFFF" opacity="0.85"/>
    <rect x="280" y="600" width="200" height="28" rx="14" fill="#FFFFFF" opacity="0.65"/>
    <rect x="280" y="660" width="240" height="28" rx="14" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- Flow connector: bubble to bars -->
  <path d="M620 480 C660 420 700 380 740 340" stroke="#8B6BFF" stroke-width="16" stroke-linecap="round" opacity="0.35"/>
  <path d="M680 520 C710 460 730 400 750 340" stroke="#FFB830" stroke-width="12" stroke-linecap="round" opacity="0.3"/>

  <!-- Sparkle accents -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M780 140 L790 170 L820 180 L790 190 L780 220 L770 190 L740 180 L770 170 Z"/>
    <path d="M900 420 L906 436 L922 442 L906 448 L900 464 L894 448 L878 442 L894 436 Z"/>
  </g>
</svg>
