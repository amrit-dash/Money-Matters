<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Money Matters app icon (light)">
  <defs>
    <style>
      .fg { fill: #ffffff; }
      .stroke { fill: none; stroke: #ffffff; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Opaque field; iOS applies squircle mask -->
  <rect width="1024" height="1024" fill="#1a8990"/>

  <g stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spokes -->
    <line x1="512" y1="512" x2="512" y2="248" stroke-width="5"/>
    <line x1="512" y1="512" x2="512" y2="776" stroke-width="5"/>
    <line x1="512" y1="512" x2="248" y2="512" stroke-width="5"/>
    <line x1="512" y1="512" x2="776" y2="512" stroke-width="5"/>
    <circle cx="512" cy="380" r="9" class="fg" stroke="none"/>
    <circle cx="512" cy="644" r="9" class="fg" stroke="none"/>
    <circle cx="380" cy="512" r="9" class="fg" stroke="none"/>
    <circle cx="644" cy="512" r="9" class="fg" stroke="none"/>

    <!-- Peripheral rings -->
    <g stroke-width="5">
      <circle cx="248" cy="248" r="78"/>
      <circle cx="248" cy="248" r="66"/>
      <circle cx="776" cy="248" r="78"/>
      <circle cx="776" cy="248" r="66"/>
      <circle cx="248" cy="776" r="78"/>
      <circle cx="248" cy="776" r="66"/>
      <circle cx="776" cy="776" r="78"/>
      <circle cx="776" cy="776" r="66"/>
    </g>

    <!-- Central hub rings -->
    <circle cx="512" cy="512" r="118" stroke-width="6"/>
    <circle cx="512" cy="512" r="100" stroke-width="5"/>
  </g>

  <!-- Book (top-left) -->
  <g class="stroke" stroke-width="5" transform="translate(248 248)">
    <path d="M-28 -8 L0 -22 L28 -8 V28 L0 42 L-28 28 Z"/>
    <line x1="0" y1="-22" x2="0" y2="42"/>
    <line x1="-14" y1="2" x2="14" y2="2"/>
    <line x1="-14" y1="12" x2="14" y2="12"/>
    <line x1="-14" y1="22" x2="14" y2="22"/>
  </g>

  <!-- Growth chart (top-right) -->
  <g class="fg" stroke="none" transform="translate(776 248)">
    <rect x="-34" y="8" width="16" height="28" rx="2"/>
    <rect x="-10" y="-4" width="16" height="40" rx="2"/>
    <rect x="14" y="-22" width="16" height="58" rx="2"/>
  </g>
  <path class="stroke" stroke-width="5" d="M752 222 L808 178 L808 210" transform="translate(0 0)"/>

  <!-- Gear (bottom-left) -->
  <g class="fg" stroke="none" transform="translate(248 776)">
    <path d="M0-34 L9-32 L14-24 L22-22 L28-14 L32-9 L34 0 L32 9 L28 14 L22 22 L14 28 L9 32 L0 34 L-9 32 L-14 28 L-22 22 L-28 14 L-32 9 L-34 0 L-32-9 L-28-14 L-22-22 L-14-28 L-9-32 Z"/>
    <circle cx="0" cy="0" r="14" fill="#1a8990"/>
  </g>

  <!-- AI head (bottom-right) -->
  <g class="stroke" stroke-width="5" transform="translate(776 776)">
    <path d="M-36 8 C-36 -28 -8 -44 8 -44 C30 -44 40 -18 40 8 C40 32 24 48 0 48 C-20 48 -36 32 -36 8 Z"/>
    <circle cx="-8" cy="-6" r="4" class="fg" stroke="none"/>
    <line x1="4" y1="-12" x2="22" y2="-22"/>
    <circle cx="22" cy="-22" r="3" class="fg" stroke="none"/>
    <line x1="0" y1="0" x2="18" y2="4"/>
    <circle cx="18" cy="4" r="3" class="fg" stroke="none"/>
    <line x1="-4" y1="14" x2="12" y2="24"/>
    <circle cx="12" cy="24" r="3" class="fg" stroke="none"/>
  </g>
  <!-- Rupee (vector) -->
  <g class="fg" stroke="none" transform="translate(512 520)">
    <path d="M-8 -52 H44 V-36 H-8 V-8 H36 C52 -8 60 4 60 18 C60 34 48 44 30 44 H-8 V60 H-24 V44 H-40 V28 H-24 V-8 H-8 V-28 H-24 V-44 H-8 Z M-8 -20 H28 C38 -20 44 -14 44 -6 C44 2 38 8 28 8 H-8 V-20 Z"/>
    <line x1="-48" y1="-52" x2="48" y2="-52" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>

<!-- Sparkles -->
  <g class="fg" stroke="none">
    <path d="M452 430 l6 0 l3 6 l-3 6 l-6 0 l-3-6 z"/>
    <path d="M572 456 l8 0 l4 8 l-4 8 l-8 0 l-4-8 z"/>
    <path d="M468 572 l5 0 l2.5 5 l-2.5 5 l-5 0 l-2.5-5 z"/>
    <path d="M556 568 l7 0 l3.5 7 l-3.5 7 l-7 0 l-3.5-7 z"/>
    <path d="M538 438 l4 0 l2 4 l-2 4 l-4 0 l-2-4 z"/>
  </g>
</svg>
