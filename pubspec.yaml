publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.5
  app_links: ^6.4.0
  sqflite: ^2.4.2
  path: ^1.9.1
  http: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
